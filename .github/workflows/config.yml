name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ synchronize, opened ]
  workflow_dispatch:

jobs:
  run-unit-tests:
    runs-on: ubuntu-22.04
    container:
      image: docker://nrel/openstudio:3.9.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install software
        run: |
          rm -f Gemfile.lock && bundle install
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update
          sudo -E apt-get install -y wget unzip python3-sphinx-rtd-theme

      - name: Check measures
        shell: bash
        run: |
          out=$(openstudio tasks.rb update_measures 2>&1)
          if [[ "$out" == *"RuboCop failed"* ]]; then echo "$out" && exit 1; fi
          echo "Checking for file differences..."
          git config --global --add safe.directory $(realpath .)
          git diff --exit-code --ignore-cr-at-eol *.rb

      - name: Check HPXMLs/Schedules
        shell: bash
        run: |
          echo "Regenerating HPXML files..."
          openstudio tasks.rb update_hpxmls
          git config --global --add safe.directory $(realpath .)
          echo "Checking for HPXML differences..."
          echo "If differences are found below, then HPXMLs need to be regenerated using: openstudio tasks.rb update_hpxmls"
          git diff --exit-code --ignore-cr-at-eol workflow/*.xml
          echo "Checking for schedule CSV differences..."
          echo "If differences are found below, then schedule CSVs need to be regenerated using: openstudio tasks.rb update_hpxmls"
          git diff --stat --ignore-cr-at-eol HPXMLtoOpenStudio/resources/schedule_files/*.csv

          # Run the detailed diff script if there are changes
          if ! git diff --quiet --ignore-cr-at-eol HPXMLtoOpenStudio/resources/schedule_files/*.csv; then
            echo "Detailed schedule file differences:"
            cd HPXMLtoOpenStudio/resources/schedule_files
            openstudio print_diff.py
          fi

      - name: Run measure unit tests
        run: |
          bundle exec rake test_measures

      - name: Store code coverage
        uses: actions/upload-artifact@v4
        with:
          path: coverage
          name: coverage

      - name: Store results
        uses: actions/upload-artifact@v4
        with:
          path: workflow/tests/test_results
          name: results-unit-tests

      - name: Build documentation
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going -n"

      - name: Check documentation
        run: |
          echo "Checking for misaligned documentation footnotes..."
          for RST_FILE in docs/source/*.rst; do NUM_REFS=$(grep -F -o "[#]_" $RST_FILE | wc -l); NUM_FOOTNOTES=$(grep -F -o ".. [#]" $RST_FILE | wc -l); if [ $NUM_REFS != $NUM_FOOTNOTES ]; then echo "ERROR: Number of footnote references doesn't match number of footnotes in $RST_FILE." && exit 1; fi done

      - name: Save Docs
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/

  run-workflow1-tests:
    runs-on: ubuntu-22.04
    container:
      image: docker://nrel/openstudio:3.9.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install software
        run: |
          rm -f Gemfile.lock && bundle install

      - name: Run workflow tests
        run: |
          bundle exec rake test_workflow1

      - name: Store results
        uses: actions/upload-artifact@v4
        with:
          path: workflow/tests/test_results
          name: results-workflow1-tests

  run-workflow2-tests:
    runs-on: ubuntu-22.04
    container:
      image: docker://nrel/openstudio:3.9.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install software
        run: |
          rm -f Gemfile.lock && bundle install

      - name: Run workflow tests
        run: |
          bundle exec rake test_workflow2

      - name: Store results
        uses: actions/upload-artifact@v4
        with:
          path: workflow/tests/test_results
          name: results-workflow2-tests

  run-windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install software and run test
        shell: pwsh
        run: |
          $env:OS_VERSION="3.9.0"
          $env:OS_SHA="c77fbb9569"
          Invoke-WebRequest -OutFile Windows.tar.gz -URI "https://github.com/NREL/OpenStudio/releases/download/v${env:OS_VERSION}/OpenStudio-${env:OS_VERSION}+${env:OS_SHA}-Windows.tar.gz"
          tar -xzf Windows.tar.gz
          & .\OpenStudio-${env:OS_VERSION}+${env:OS_SHA}-Windows\bin\openstudio.exe workflow\run_simulation.rb -x workflow\sample_files\base.xml --hourly ALL --add-component-loads --add-stochastic-schedules

  merge-results:
    runs-on: ubuntu-22.04
    needs: [run-workflow1-tests, run-workflow2-tests, run-unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: test_results
          pattern: results-*
          merge-multiple: true

      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: results-*

      - name: Merge results
        run: |
          mkdir workflow/tests/test_results
          cp -r test_results/results* workflow/tests/test_results
          cd workflow/tests
          pip install pandas
          for csv in test_results/*1_*.csv; do csv2="${csv/1_/2_}"; csv_out="${csv/1_/_}"; python merge.py $csv $csv2 $csv_out; rm $csv; rm $csv2; done

      - name: Store results
        uses: actions/upload-artifact@v4
        with:
          path: workflow/tests/test_results
          name: test_results

  compare-results:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    needs: merge-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Store base results
        uses: actions/upload-artifact@v4
        with:
          path: workflow/tests/base_results
          name: base_results

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download base results
        uses: actions/download-artifact@v4
        with:
          path: base_results
          name: base_results

      - name: Download feature results
        uses: actions/download-artifact@v4
        with:
          path: test_results
          name: test_results

      - name: Compare results
        run: |
          cp -r base_results/results*.csv workflow/tests/base_results
          mkdir workflow/tests/test_results
          cp -r test_results/results* workflow/tests/test_results

          pip install numpy
          pip install pandas
          pip install plotly
          pip install kaleido

          python workflow/tests/compare.py -a results
          python workflow/tests/compare.py -a visualize

      - name: Store comparisons
        uses: actions/upload-artifact@v4
        with:
          path: workflow/tests/comparisons
          name: comparisons

  update-results:
    runs-on: ubuntu-22.04
    needs: merge-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download feature results
        uses: actions/download-artifact@v4
        with:
          path: test_results
          name: test_results

      - name: Commit latest results
        shell: bash
        run: |
          branch_name="${{ github.head_ref }}"
          git pull origin $branch_name
          cp -r test_results/results* workflow/tests/base_results
          git add workflow/tests/base_results
          git status
          if [[ $(git diff --cached --exit-code) ]]; then
            git config --global user.email "github-action@users.noreply.github.com"
            git config --global user.name "GitHub Action"
            git commit -m "Latest results."
            echo "Pushing to branch: $branch_name"
            git push -u origin $branch_name
          fi

  schedule-diff:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python and Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Check for CSV Changes
        id: check_files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/master...HEAD -- HPXMLtoOpenStudio/resources/schedule_files/*.csv)
          if [ -n "$CHANGED_FILES" ]; then
            echo "csv_changed=true" >> $GITHUB_OUTPUT
          else
            echo "csv_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Schedule Diff
        id: diff
        if: steps.check_files.outputs.csv_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          chmod +x HPXMLtoOpenStudio/resources/schedule_files/print_diff.py
          OUTPUT=$(python HPXMLtoOpenStudio/resources/schedule_files/print_diff.py --with origin/master 2>&1) || true
          ACTUAL_CHANGES=$(echo "$OUTPUT" | grep -q "columns changed" && echo "true" || echo "false")
          echo "actual_changes=$ACTUAL_CHANGES" >> "$GITHUB_OUTPUT"
          echo "diff_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set Status Message
        id: status
        run: |
          if [ "${{ steps.diff.outputs.actual_changes }}" = "true" ]; then
            echo "message=**Changes detected** in schedule files between this PR and master" >> $GITHUB_OUTPUT
          else
            echo "message=**No changes detected** in schedule files between this PR and master" >> $GITHUB_OUTPUT
          fi

      - name: Find PR Number
        id: find_pr
        if: github.event_name == 'push' && (steps.check_files.outputs.csv_changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          PR_NUMBER=$(gh pr list --head ${{ github.ref_name }} --json number -q '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "pr_number=" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Existing Comment
        uses: peter-evans/find-comment@v2
        id: find-comment
        if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || steps.find_pr.outputs.pr_number != '')
        with:
          issue-number: ${{ github.event.pull_request.number || steps.find_pr.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Schedule Files Diff Report'

      - name: Remove Existing Comment if No Changes
        uses: peter-evans/delete-comment@v2
        if: steps.find-comment.outputs.comment-id != '' && (
             steps.check_files.outputs.csv_changed == 'false' ||
             steps.diff.outputs.actual_changes == 'false')
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Comment if Changes Exist
        uses: peter-evans/create-or-update-comment@v2
        if: steps.find-comment.outputs.comment-id != '' && steps.diff.outputs.actual_changes == 'true'
          || (steps.find-comment.outputs.comment-id == '' && steps.diff.outputs.actual_changes == 'true')
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number || steps.find_pr.outputs.pr_number }}
          body: |
            ## Schedule Files Diff Report
            ${{ steps.status.outputs.message }}

            <details>
            <summary>Click to expand full diff output</summary>

            ```
            ${{ steps.diff.outputs.diff_output }}
            ```

            </details>

            _Last updated: ${{ format(github.event.repository.updated_at, 'YYYY-MM-DD HH:mm:ss') }}_

            _This comment is automatically generated by GitHub Actions whenever CSV files change._